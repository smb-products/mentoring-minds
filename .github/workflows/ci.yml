name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The merge queue tests each PR on the main it lands on (RULES.md, The loop).
  merge_group:

# A newer push to a PR replaces its run. Main and the merge queue are never cancelled: each of their runs has
# its own group (the commit). A shared group isn't enough even without cancel-in-progress, because GitHub
# keeps one pending run per group and cancels the one waiting when a third arrives (W8's main run, 8e57942).
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('ci-pr-{0}', github.ref) || format('ci-{0}-{1}', github.event_name, github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Two speeds, one required check (Javaris, 2026-11-27):
#   pull_request: the fast part only: migrations, drift, typecheck, unit and contract (plus the kit tests and
#                 plan lint when those change). A PR labelled ci:full gets the full suite instead.
#   merge_group:  the full suite: integration and the browser tests, holdouts included, in parallel jobs (the
#                 browser tests in E2E_SHARDS shards). The queue is what protects main, and a PR it drops is
#                 reported by kit/plan.py refresh.
#   push to main: the full suite again, as the record of what landed.
# `check` is the ruleset's required check. It waits for every job and fails if any failed or was cancelled; a
# job this change doesn't need is skipped, which counts as passing. kit/ci_scope.py decides which part runs.

env:
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mm_test
  DIRECT_URL: postgresql://postgres:postgres@localhost:5432/mm_test
  TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mm_test
  E2E_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mm_e2e_test
  AUTH_SECRET: ci-only-secret-not-used-anywhere-else
  INVITE_PEPPER: ci-only-pepper

jobs:
  # What changed: holdout-only and plan-only changes run only what they touch; kit changes add the kit tests.
  scope:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      app: ${{ steps.scope.outputs.app }}
      kit: ${{ steps.scope.outputs.kit }}
      plan: ${{ steps.scope.outputs.plan }}
      holdout: ${{ steps.scope.outputs.holdout }}
      holdout_tests: ${{ steps.scope.outputs.holdout_tests }}
      holdout_specs: ${{ steps.scope.outputs.holdout_specs }}
      fast: ${{ steps.scope.outputs.fast }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2  # a PR's merge commit and its base parent
      - id: scope
        env:
          EVENT: ${{ github.event_name }}
          QUEUE_BASE: ${{ github.event.merge_group.base_sha }}
          FULL_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'ci:full') }}
        run: |
          case "$EVENT" in
            pull_request) base="$(git rev-parse HEAD^1)";;
            merge_group)  git fetch -q --no-tags --depth=1 origin "$QUEUE_BASE"; base="$QUEUE_BASE";;
            *)            base="";;
          esac
          if [ -n "$base" ]; then
            git diff --name-only "$base" HEAD | tee "$RUNNER_TEMP/changed.txt"
            python3 kit/ci_scope.py < "$RUNNER_TEMP/changed.txt" > "$RUNNER_TEMP/scope.txt"
          else
            python3 kit/ci_scope.py --full < /dev/null > "$RUNNER_TEMP/scope.txt"
          fi
          # A PR labelled ci:full (a CI change, say) runs the full suite, as the queue would.
          [ "$EVENT" = pull_request ] && [ "$FULL_LABEL" != true ] && echo "fast=true" >> "$RUNNER_TEMP/scope.txt"
          sed 's/^/scope: /' "$RUNNER_TEMP/scope.txt"
          cat "$RUNNER_TEMP/scope.txt" >> "$GITHUB_OUTPUT"

  kit:
    needs: scope
    if: needs.scope.outputs.kit == 'true' || needs.scope.outputs.plan == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - if: needs.scope.outputs.kit == 'true'
        run: |
          git config --global user.name ci && git config --global user.email ci@localhost
          python3 kit/tests/test_kit.py
      - if: needs.scope.outputs.plan == 'true'
        run: python3 kit/plan.py lint

  # Both speeds: migrations, drift, typecheck, unit and contract.
  fast:
    needs: scope
    if: needs.scope.outputs.app == 'true' || needs.scope.outputs.holdout == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: mm_test }
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      # Proves the migrations apply cleanly from empty, exactly as on Vercel.
      - if: needs.scope.outputs.app == 'true'
        run: npx prisma migrate deploy
      # Fails if schema.prisma changed without a migration (uses a throwaway database).
      - if: needs.scope.outputs.app == 'true'
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -c 'CREATE DATABASE mm_shadow'
          npx prisma migrate diff --from-migrations prisma/migrations --to-schema-datamodel prisma/schema.prisma --shadow-database-url postgresql://postgres:postgres@localhost:5432/mm_shadow --exit-code
      - run: npm run typecheck
      - if: needs.scope.outputs.app == 'true'
        run: npx vitest run --project unit --project contract

  # Full suite only: integration and the vitest holdouts (vitest makes its own tables from prisma/migrations).
  integration:
    needs: scope
    if: needs.scope.outputs.fast != 'true' && (needs.scope.outputs.app == 'true' || needs.scope.outputs.holdout_tests != '')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: mm_test }
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - if: needs.scope.outputs.app == 'true'
        run: npx vitest run --project integration --project holdout
      # Holdout-only: just the holdouts that changed. Paths go through env, never ${{ }} in a script: a fork PR
      # picks its own file names.
      - if: needs.scope.outputs.app != 'true'
        env:
          FILES: ${{ needs.scope.outputs.holdout_tests }}
        run: npx vitest run --project holdout $FILES

  # Full suite only: a production build, then the browser tests in shards. Each shard has its own database and
  # server; a spec file always runs whole in one shard (workers: 1, not fullyParallel).
  e2e:
    needs: scope
    if: needs.scope.outputs.fast != 'true' && (needs.scope.outputs.app == 'true' || needs.scope.outputs.holdout_specs != '')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: mm_test }
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # A holdout-only change has only a few specs: shard 1 runs them, the other shards stop after checkout.
      RUN: ${{ needs.scope.outputs.app == 'true' || matrix.shard == 1 }}
    steps:
      - uses: actions/checkout@v4
      - if: env.RUN == 'true'
        uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - if: env.RUN == 'true'
        run: npm ci
      - if: env.RUN == 'true'
        run: npm run build:e2e
      - if: env.RUN == 'true'
        run: PGPASSWORD=postgres psql -h localhost -U postgres -c 'CREATE DATABASE mm_e2e_test'
      # The runner's Microsoft apt source has returned 403s (#170), and --with-deps runs apt-get update. Playwright
      # needs nothing from it.
      - if: env.RUN == 'true'
        run: |
          sudo find /etc/apt/sources.list.d -iname '*microsoft*' -print -delete
          npx playwright install --with-deps chromium
      # Browser tests (tests/e2e and the holdout specs): sign-in always; each wiring area once it's listed in LIVE.
      - if: env.RUN == 'true' && needs.scope.outputs.app == 'true'
        run: npx playwright test --shard=${{ matrix.shard }}/4
      - if: env.RUN == 'true' && needs.scope.outputs.app != 'true'
        env:
          FILES: ${{ needs.scope.outputs.holdout_specs }}
        run: npx playwright test --project=holdout $FILES
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-${{ matrix.shard }}
          path: playwright-report/
          retention-days: 14
          if-no-files-found: ignore

  # The required check: green only when every job above passed or was skipped as not needed.
  check:
    needs: [scope, kit, fast, integration, e2e]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | python3 -c '
          import json, sys
          bad = {k: v["result"] for k, v in json.load(sys.stdin).items() if v["result"] not in ("success", "skipped")}
          for k, v in bad.items():
              print(f"::error::{k}: {v}")
          sys.exit(1 if bad else 0)'
